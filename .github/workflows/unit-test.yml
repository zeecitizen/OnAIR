name: Unit test run

# Verification branch on a fork: not for upstream.
# ubuntu-latest (26.04) has no Python 3.8/3.9, so the runner is pinned here.
on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      run: python -m coverage run --branch --source=onair,plugins -m pytest ./test/
    - name: Coverage report
      run: coverage report --skip-empty --fail-under=100
